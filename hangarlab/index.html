<meta charset="utf-8">
<title>HangarLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky instrument header + tab rail; each tool is a two-pane bench (inputs left, readouts right) that stacks on phones. */
:root {
  --bg: #1a1a18; --bg-grid: transparent; --panel: #232321; --panel-2: #2b2b28; --line: #34342f; --line-2: #45443e;
  --fg: #ecebe6; --muted: #a8a69d; --faint: #78766e;
  --accent: #ff6a13; --accent-ink: #1a0d03; --accent-soft: rgba(255, 106, 19, 0.14);
  --cyan: #4aa3df; --good: #57b36a; --warn: #e8b23a; --crit: #e5484d;
  --c1: #ff6a13; --c2: #4aa3df; --c3: #57b36a; --c4: #b78cdb; --c5: #e8b23a; --c6: #e5484d; --c7: #3fbfb0; --c8: #a8a69d;
  --grid: rgba(236, 235, 230, 0.07);
  --display: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "Roboto Mono", ui-monospace, Consolas, monospace;
  --r: 4px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f2f1ec; --bg-grid: transparent; --panel: #fbfaf7; --panel-2: #ecebe5; --line: #dcdad2; --line-2: #c8c5bb;
  --fg: #1d1d1b; --muted: #5f5d55; --faint: #8d8a80;
  --accent: #d9530a; --accent-ink: #ffffff; --accent-soft: rgba(217, 83, 10, 0.1);
  --cyan: #1f74b5; --good: #2f8a43; --warn: #a8730b; --crit: #c4302b;
  --c1: #d9530a; --c2: #1f74b5; --c3: #2f8a43; --c4: #7c4dab; --c5: #a8730b; --c6: #c4302b; --c7: #1f8a7f; --c8: #6f6d65;
  --grid: rgba(29, 29, 27, 0.08);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font: 15px/1.45 var(--body); min-height: 100vh;
}
a { color: var(--cyan); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; }
h3 { font-size: 14px; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, input[type="number"], td.n { font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.brand svg { width: 30px; height: 30px; color: var(--accent); }
.brand h1 { font-size: 22px; font-weight: 700; }
.brand small { display: block; font: 500 12px/1.1 var(--body); color: var(--faint); }
.proj { display: flex; gap: 8px; align-items: center; flex: 1 1 280px; min-width: 0; }
.proj select { flex: 1 1 auto; min-width: 0; max-width: 340px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 12px; } /* wraps to a second row instead of hiding tabs off-screen */
.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px 8px; cursor: pointer;
  color: var(--muted); font: 600 16px/1 var(--display); white-space: nowrap;
}
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* controls */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: var(--r); cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line-2); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); border-color: var(--line-2); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.icon { padding: 5px 8px; }
.btn.danger:hover { border-color: var(--crit); color: var(--crit); }
.btn:disabled { opacity: 0.45; cursor: default; }
input[type="text"], input[type="number"], input[type="search"], input:not([type]), select, textarea {
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 4px; padding: 5px 7px; min-width: 0; width: 100%;
}
input[type="number"] { font-family: var(--mono); font-size: 13px; }
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 10px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

main { padding: 16px; padding-block: 16px 40px; max-width: 1600px; margin: 0 auto; }

/* bench layout */
.bench { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 10px; position: sticky; top: 96px; max-height: calc(100vh - 110px); overflow: auto; padding-right: 4px; scrollbar-width: thin; }
@media (max-width: 900px) { .side { position: static; max-height: none; overflow: visible; } }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }

.group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.group > summary {
  list-style: none; cursor: pointer; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center;
  font: 600 15px/1.2 var(--display); color: var(--muted);
}
.group > summary::-webkit-details-marker { display: none; }
.group > summary::after { content: "+"; font-family: var(--mono); color: var(--faint); }
.group[open] > summary::after { content: "−"; }
.group[open] > summary { color: var(--fg); border-bottom: 1px solid var(--line); }
.group > summary:hover { color: var(--fg); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 10px 12px 12px; }
.f { display: grid; gap: 3px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }
.f > span { font-size: 13px; color: var(--muted); }
.f .in { display: flex; align-items: center; gap: 4px; }
.f .in em { font: normal 11px var(--mono); color: var(--faint); white-space: nowrap; }
.f.check { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; font-size: 13px; }
.hint { grid-column: 1 / -1; font-size: 13px; color: var(--faint); margin: 0; }
.hint b { color: var(--muted); font-weight: 500; }
.tip { display: inline-grid; place-items: center; width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 1px solid var(--line-2); background: none; color: var(--muted); font: 600 10px/1 var(--body); cursor: pointer; vertical-align: 1px; margin-left: 4px; text-transform: none; letter-spacing: 0; }
.tip:hover, .tip:focus-visible { border-color: var(--accent); color: var(--accent); }
#tipPop { position: fixed; z-index: 1000; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; font: 400 12.5px/1.45 var(--body); box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: auto; }
#tipPop[hidden] { display: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fg) 4%, transparent); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h p { margin: 0; font-size: 12px; color: var(--faint); }

/* readouts: instrument placards */
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ro {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; position: relative; min-width: 0; transition: border-color 0.15s;
}
.ro:hover { border-color: var(--line-2); }
.ro.key { box-shadow: inset 0 2px 0 var(--accent); }
.ro .l { font: 600 14px/1.2 var(--display); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ro.good .l::before, .ro.warn .l::before, .ro.crit .l::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ro.good .l::before { background: var(--good); } .ro.warn .l::before { background: var(--warn); } .ro.crit .l::before { background: var(--crit); }
.ro.warn .v { color: var(--warn); } .ro.crit .v { color: var(--crit); }
.ro .v { font: 600 28px/1.15 var(--body); margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.ro .v small { font: 500 14px var(--body); color: var(--faint); margin-left: 4px; }
.ro .s { font-size: 13px; color: var(--faint); margin-top: 2px; }
@media (min-width: 1400px) {
  main { max-width: 1920px; }
  .readouts { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .ro { padding: 16px 20px; }
  .ro .l { font-size: 16px; }
  .ro .v { font-size: 36px; margin-top: 6px; }
  .ro .v small { font-size: 16px; }
  .ro .s { font-size: 14px; margin-top: 4px; }
}

.checks { display: grid; gap: 6px; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 7px 10px; border-radius: 4px; background: var(--panel-2); }
.pill { font: 600 13px/1 var(--display); padding: 4px 8px; border-radius: 3px; white-space: nowrap; background: var(--panel-2); }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 15%, transparent); } .pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); } .pill.crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 15%, transparent); } .pill.info { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 15%, transparent); }
.pill.mute { color: var(--faint); }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.chart { width: 100%; min-height: 240px; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font: 600 14px/1.2 var(--display); color: var(--muted); padding: 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); }
td input, td select { padding: 3px 5px; font-size: 12.5px; }
td select { min-width: 84px; }
tr.auto td { color: var(--muted); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
tr.total td { font-weight: 600; background: var(--panel-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); text-align: right; }

/* mass bar */
.massbar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.massbar span { display: block; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

/* power tree */
.tree { display: grid; gap: 0; justify-items: center; overflow-x: auto; padding-bottom: 4px; }
.node { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 12px; font-size: 13px; text-align: center; min-width: 180px; }
.node b { font-family: var(--display); display: block; }
.node small { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.node.batt { border-color: var(--accent); }
.vline { width: 2px; height: 18px; background: var(--line-2); }
.branches { display: flex; gap: 12px; justify-content: center; position: relative; padding-top: 18px; flex-wrap: nowrap; }
.branches::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: calc(100% - 180px); height: 2px; background: var(--line-2); }
.branch { display: flex; flex-direction: column; align-items: center; position: relative; }
.branch::before { content: ""; width: 2px; height: 18px; background: var(--line-2); margin-top: -18px; }
.branch ul { list-style: none; padding: 6px 0 0; margin: 0; font-size: 11.5px; color: var(--muted); text-align: center; max-width: 200px; }

.rails { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.rail-v { font: 700 30px/1 var(--display); color: var(--accent); }

/* materials */
.mat { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mat:last-child { border-bottom: 0; }
.mat.out { opacity: 0.5; }
.mat .score { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.mat .score span { display: block; height: 100%; background: var(--accent); }
.mat .name { font: 600 14px var(--display); }
.mat .props { font: 11.5px var(--mono); color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.chip.no { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
@media (max-width: 600px) { .mat { grid-template-columns: 1fr; } }

/* logs */
.tree-msgs { max-height: 640px; overflow: auto; font-size: 12.5px; }
.tree-msgs details { border-bottom: 1px solid var(--line); }
.tree-msgs summary { cursor: pointer; padding: 5px 4px; font-family: var(--mono); display: flex; justify-content: space-between; }
.tree-msgs summary span { color: var(--faint); }
.tree-msgs label { display: flex; gap: 6px; align-items: center; padding: 2px 4px 2px 16px; font-family: var(--mono); cursor: pointer; }
.tree-msgs label:hover { background: var(--panel-2); }
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
canvas.track { width: 100%; height: 300px; display: block; border-radius: 4px; background: var(--panel-2); }
.msglist { max-height: 220px; overflow: auto; font: 12px var(--mono); }

.sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; }
.note { font-size: 12.5px; color: var(--muted); max-width: 70ch; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 50; }

dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line-2); border-radius: 8px; padding: 0; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(0, 0, 0, 0.62); backdrop-filter: blur(3px); }
.dlg-x { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; color: var(--fg); flex: none; }
.dlg-x svg.i { width: 16px; height: 16px; }
.dlg-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg-b { padding: 14px 16px; display: grid; gap: 10px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }

/* subsystem colors (--sc set per row) */
.subtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--sc); white-space: nowrap; }
.subtag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--sc); }
table.bom tbody td:first-child { box-shadow: inset 4px 0 0 var(--sc, transparent); padding-left: 10px; }
table.bom .subin { color: var(--sc); font-weight: 600; }
table.bom tr.grp td { background: color-mix(in srgb, var(--sc) 13%, var(--panel)); padding-block: 7px; }
table.bom tbody tr:not(.grp):not(.total):hover td { background: color-mix(in srgb, var(--sc, var(--accent)) 6%, transparent); }
.hint.src { padding: 6px 8px; border-radius: 4px; background: color-mix(in srgb, var(--good) 11%, transparent); color: var(--muted); }
.hint.src.est { background: color-mix(in srgb, var(--warn) 13%, transparent); }

/* export dialog */
.exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.exp { display: grid; gap: 4px; align-content: start; text-align: left; padding: 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel-2); cursor: pointer; }
.exp:hover { border-color: var(--accent); }
.exp b { font-family: var(--display); font-size: 14px; }
.exp span { font-size: 12px; color: var(--muted); }

/* uPlot (inlined stylesheet, themed) */
.uplot, .uplot *, .uplot *::before, .uplot *::after { box-sizing: border-box; }
.uplot { font-family: var(--body); line-height: 1.5; width: min-content; }
.u-wrap { position: relative; user-select: none; }
.u-over, .u-under { position: absolute; }
.u-under { overflow: hidden; }
.uplot canvas { display: block; position: relative; width: 100%; height: 100%; }
.u-axis { position: absolute; }
.u-legend { font-size: 12px; margin: 4px auto 0; text-align: left; font-family: var(--mono); color: var(--muted); }
.u-inline { display: block; } .u-inline * { display: inline-block; }
.u-inline tr { margin-right: 14px; }
.u-legend th { font-weight: 500; }
.u-legend th > * { vertical-align: middle; display: inline-block; }
.u-legend .u-marker { width: 0.8em; height: 0.8em; margin-right: 4px; background-clip: padding-box !important; border-radius: 2px; }
.u-inline.u-live th::after { content: ":"; vertical-align: middle; }
.u-inline:not(.u-live) .u-value { display: none; }
.u-series > * { padding: 2px; }
.u-series th { cursor: pointer; }
.u-legend .u-off > * { opacity: 0.3; }
.u-select { background: var(--accent-soft); position: absolute; pointer-events: none; }
.u-cursor-x, .u-cursor-y { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.u-hz .u-cursor-x, .u-vt .u-cursor-y { height: 100%; border-right: 1px dashed var(--faint); }
.u-hz .u-cursor-y, .u-vt .u-cursor-x { width: 100%; border-bottom: 1px dashed var(--faint); }
.u-cursor-pt { position: absolute; top: 0; left: 0; border-radius: 50%; border: 0 solid; pointer-events: none; will-change: transform; background-clip: padding-box !important; }
.u-axis.u-off, .u-select.u-off, .u-cursor-x.u-off, .u-cursor-y.u-off, .u-cursor-pt.u-off { display: none; }

/* UX additions */
.sep { width: 1px; height: 22px; background: var(--line-2); margin: 0 2px; }
.btn.icon { min-width: 31px; justify-content: center; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; }
.badge { font: 600 10px/1 var(--mono); letter-spacing: 0; padding: 3px 5px; border-radius: 8px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-2); }
.badge.crit { background: var(--crit); color: #fff; border-color: transparent; }
.badge.warn { background: var(--warn); color: #1c1303; border-color: transparent; }
.badge.dot { width: 7px; height: 7px; padding: 0; border-radius: 50%; }
.badge.dot.good { background: var(--good); border-color: transparent; }
.side-tools { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: -4px; }
.toast { display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 14px; }
:root[data-theme="light"] .toast button { color: #ff8a4a; }
input:invalid { border-color: var(--crit); box-shadow: 0 0 0 1px color-mix(in srgb, var(--crit) 35%, transparent); }
.group > summary { transition: color 0.15s; }
.ro[title] { cursor: default; }
.tabs { scroll-behavior: smooth; }

.settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; align-items: start; }
.settings .card h2 { margin-bottom: 2px; }
.btn.danger { color: var(--crit); }

select.subsel { color: var(--sc); font-weight: 600; }
select.subsel option { background: var(--panel); font-weight: 600; }

.stl3d { grid-column: 1 / -1; display: grid; gap: 6px; }
.stl-tools { gap: 6px; }
.stl-host { height: 300px; border-radius: var(--r); overflow: hidden; background: var(--panel-2); cursor: grab; touch-action: none; }
.stl-host canvas { display: block; }

/* quick start */
dialog.qs-dlg { width: min(620px, calc(100vw - 32px)); }
.qs { font-size: 15px; line-height: 1.55; }
.qs p { margin: 0 0 10px; }
.qs-list { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 6px; }
.qs code { font-family: var(--mono); font-size: 13px; background: var(--panel-2); padding: 1px 5px; border-radius: 3px; }
.qs-title { font-size: 19px; }
.qs-dots { display: flex; gap: 6px; justify-content: center; padding-top: 4px; }
.qs-dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: var(--line-2); cursor: pointer; }
.qs-dots button[aria-current="true"] { background: var(--accent); width: 20px; border-radius: 4px; }
.dlg-f .f.check { width: auto; }

.mt-row > td { background: var(--panel-2); padding: 8px 12px 12px 28px; }
.mt-tests table { width: auto; min-width: 60%; }
.mt-tests th { position: static; background: none; }

.libpill { font: 600 9.5px/1 var(--mono, monospace); letter-spacing: .06em; padding: 3px 5px; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); cursor: pointer; flex: none; }
.libpill:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
table.cmp th:first-child { text-align: left; white-space: nowrap; color: var(--muted); font-weight: 500; }
table.cmp td.best { color: var(--good); font-weight: 600; }
table.mis td .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; vertical-align: 0; }
table.mis td.bad { color: var(--crit); font-weight: 600; }
.misbar { position: relative; display: flex; height: 14px; border-radius: 3px; overflow: visible; background: var(--panel-2); margin-bottom: 12px; }
.misbar span { height: 100%; }
.misbar i { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); }
.segrow select { width: auto; }
.cgbar { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); margin: 6px 0 10px; }
.cgbar .win { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 35%, transparent); border-radius: 5px; }
.cgbar b { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; background: var(--accent); border-radius: 2px; }

#setBtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

/* logo: dark artwork on the light theme, light artwork on the dark theme */
.brand .logo { height: 34px; width: auto; display: block; }
.logo-onlight { display: none !important; }
:root[data-theme="light"] .logo-onlight { display: block !important; }
:root[data-theme="light"] .logo-ondark { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.units-seg { margin: auto 4px auto auto; flex: none; }
.tabs .units-seg button { padding: 4px 9px; font: 600 11.5px/1.2 var(--body); border-bottom: 0; color: var(--muted); }
.tabs .units-seg button[aria-pressed="true"] { color: var(--accent); }

/* phone */
@media (max-width: 600px) {
  .bar { gap: 8px; padding: 8px 12px; }
  .brand small, #typePill, .actions .sep { display: none; }
  .brand .logo { height: 26px; }
  .proj { flex: 1 1 140px; }
  .actions { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
  .actions > * { flex: none; }
  .actions .btn { padding-inline: 10px; }
  .tabs { padding: 0 6px; flex-wrap: wrap; overflow: visible; row-gap: 0; } /* all tabs visible: two rows instead of a hidden scroll */
  .tabs button { padding: 8px 7px 7px; font-size: 14px; gap: 4px; }
  .units-seg { margin: 4px 0 6px auto; }
  main { padding: 12px 12px 32px; }
  .bench > .stack { order: -1; }          /* results first, inputs below */
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .ro { padding: 9px 11px; }
  .ro .v { font-size: 22px; }
  .ro .s { font-size: 12px; }
  .card { padding: 12px; }
  .card-h { flex-wrap: wrap; gap: 6px; }
  .branches { flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }
  .branches::before, .branch::before { display: none; }
  .node { min-width: 0; width: min(100%, 300px); }
  .rails { grid-template-columns: minmax(0, 1fr) !important; }
  dialog { width: calc(100vw - 16px) !important; max-width: none !important; }
}

/* flight log viewer */
#lvMap { position: relative; z-index: 0; isolation: isolate; } /* keeps Leaflet's panes under the sticky header */
.lv { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .lv { grid-template-columns: minmax(0, 1fr); } .lv-side { position: static !important; max-height: 70vh !important; order: 2; } .lv-main { order: 1; } }
.lv-side { position: sticky; top: 96px; max-height: calc(100vh - 110px); overflow: auto; scrollbar-width: thin; }
.lv-main { display: grid; gap: 16px; min-width: 0; }
.lv-top { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 16px; }
@media (max-width: 720px) { .lv-top { grid-template-columns: minmax(0, 1fr); } }
.lv-view { position: relative; height: 380px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.lv-view canvas, #lvMap { width: 100%; height: 100%; display: block; }
.lv-view canvas { cursor: grab; touch-action: none; }
.lv-hud canvas { width: 100%; max-width: 200px; aspect-ratio: 1; display: block; margin: 0 auto 10px; }
.lv-hud .kv { font-size: 12px; }
.lv-time { display: flex; gap: 8px; align-items: center; }
.lv-time input[type="range"] { flex: 1; }
.lv-pg h3 { margin: 10px 0 4px; font-size: 11px; }
.lv-chip { cursor: pointer; font: inherit; font-size: 11.5px; }
.lv-chip:hover { border-color: var(--accent); color: var(--fg); }
.lv-params { width: 100%; }
.lv-params td { font-family: var(--mono); font-size: 12px; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.lv-ev { display: grid; grid-template-columns: 50px 10px 1fr; gap: 6px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 5px 2px; cursor: pointer; font: 12px var(--mono); color: var(--fg); }
.lv-ev:not(.mode) { grid-template-columns: 50px 1fr; }
.lv-ev span { color: var(--faint); }
.lv-ev i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.lv-ev.err.bad { color: var(--crit); }
.lv-ev:hover { background: var(--panel-2); }
.leaflet-container { background: var(--panel-2); font-family: var(--body); }
