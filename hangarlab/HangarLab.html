<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta charset="utf-8">
<title>HangarLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky instrument header + tab rail; each tool is a two-pane bench (inputs left, readouts right) that stacks on phones. */
:root {
  --bg: #1a1a18; --bg-grid: transparent; --panel: #232321; --panel-2: #2b2b28; --line: #34342f; --line-2: #45443e;
  --fg: #ecebe6; --muted: #a8a69d; --faint: #78766e;
  --accent: #ff6a13; --accent-ink: #1a0d03; --accent-soft: rgba(255, 106, 19, 0.14);
  --cyan: #4aa3df; --good: #57b36a; --warn: #e8b23a; --crit: #e5484d;
  --c1: #ff6a13; --c2: #4aa3df; --c3: #57b36a; --c4: #b78cdb; --c5: #e8b23a; --c6: #e5484d; --c7: #3fbfb0; --c8: #a8a69d;
  --grid: rgba(236, 235, 230, 0.07);
  --display: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "Roboto Mono", ui-monospace, Consolas, monospace;
  --r: 4px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f2f1ec; --bg-grid: transparent; --panel: #fbfaf7; --panel-2: #ecebe5; --line: #dcdad2; --line-2: #c8c5bb;
  --fg: #1d1d1b; --muted: #5f5d55; --faint: #8d8a80;
  --accent: #d9530a; --accent-ink: #ffffff; --accent-soft: rgba(217, 83, 10, 0.1);
  --cyan: #1f74b5; --good: #2f8a43; --warn: #a8730b; --crit: #c4302b;
  --c1: #d9530a; --c2: #1f74b5; --c3: #2f8a43; --c4: #7c4dab; --c5: #a8730b; --c6: #c4302b; --c7: #1f8a7f; --c8: #6f6d65;
  --grid: rgba(29, 29, 27, 0.08);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font: 15px/1.45 var(--body); min-height: 100vh;
}
a { color: var(--cyan); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; }
h3 { font-size: 14px; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, input[type="number"], td.n { font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.brand svg { width: 30px; height: 30px; color: var(--accent); }
.brand h1 { font-size: 22px; font-weight: 700; }
.brand small { display: block; font: 500 12px/1.1 var(--body); color: var(--faint); }
.proj { display: flex; gap: 8px; align-items: center; flex: 1 1 280px; min-width: 0; }
.proj select { flex: 1 1 auto; min-width: 0; max-width: 340px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px 8px; cursor: pointer;
  color: var(--muted); font: 600 16px/1 var(--display); white-space: nowrap;
}
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* controls */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: var(--r); cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line-2); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); border-color: var(--line-2); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.icon { padding: 5px 8px; }
.btn.danger:hover { border-color: var(--crit); color: var(--crit); }
.btn:disabled { opacity: 0.45; cursor: default; }
input[type="text"], input[type="number"], input[type="search"], input:not([type]), select, textarea {
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 4px; padding: 5px 7px; min-width: 0; width: 100%;
}
input[type="number"] { font-family: var(--mono); font-size: 13px; }
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 10px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

main { padding: 16px; padding-block: 16px 40px; max-width: 1600px; margin: 0 auto; }

/* bench layout */
.bench { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 10px; position: sticky; top: 96px; max-height: calc(100vh - 110px); overflow: auto; padding-right: 4px; scrollbar-width: thin; }
@media (max-width: 900px) { .side { position: static; max-height: none; overflow: visible; } }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }

.group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.group > summary {
  list-style: none; cursor: pointer; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center;
  font: 600 15px/1.2 var(--display); color: var(--muted);
}
.group > summary::-webkit-details-marker { display: none; }
.group > summary::after { content: "+"; font-family: var(--mono); color: var(--faint); }
.group[open] > summary::after { content: "−"; }
.group[open] > summary { color: var(--fg); border-bottom: 1px solid var(--line); }
.group > summary:hover { color: var(--fg); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 10px 12px 12px; }
.f { display: grid; gap: 3px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }
.f > span { font-size: 13px; color: var(--muted); }
.f .in { display: flex; align-items: center; gap: 4px; }
.f .in em { font: normal 11px var(--mono); color: var(--faint); white-space: nowrap; }
.f.check { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; font-size: 13px; }
.hint { grid-column: 1 / -1; font-size: 13px; color: var(--faint); margin: 0; }
.hint b { color: var(--muted); font-weight: 500; }
.tip { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line-2); color: var(--faint); font: 600 9.5px var(--body); cursor: help; vertical-align: 1px; margin-left: 4px; text-transform: none; letter-spacing: 0; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fg) 4%, transparent); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h p { margin: 0; font-size: 12px; color: var(--faint); }

/* readouts: instrument placards */
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ro {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; position: relative; min-width: 0; transition: border-color 0.15s;
}
.ro:hover { border-color: var(--line-2); }
.ro.key { box-shadow: inset 0 2px 0 var(--accent); }
.ro .l { font: 600 14px/1.2 var(--display); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ro.good .l::before, .ro.warn .l::before, .ro.crit .l::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ro.good .l::before { background: var(--good); } .ro.warn .l::before { background: var(--warn); } .ro.crit .l::before { background: var(--crit); }
.ro.warn .v { color: var(--warn); } .ro.crit .v { color: var(--crit); }
.ro .v { font: 600 28px/1.15 var(--body); margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.ro .v small { font: 500 14px var(--body); color: var(--faint); margin-left: 4px; }
.ro .s { font-size: 13px; color: var(--faint); margin-top: 2px; }
@media (min-width: 1400px) {
  main { max-width: 1920px; }
  .readouts { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .ro { padding: 16px 20px; }
  .ro .l { font-size: 16px; }
  .ro .v { font-size: 36px; margin-top: 6px; }
  .ro .v small { font-size: 16px; }
  .ro .s { font-size: 14px; margin-top: 4px; }
}

.checks { display: grid; gap: 6px; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 7px 10px; border-radius: 4px; background: var(--panel-2); }
.pill { font: 600 13px/1 var(--display); padding: 4px 8px; border-radius: 3px; white-space: nowrap; background: var(--panel-2); }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 15%, transparent); } .pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); } .pill.crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 15%, transparent); } .pill.info { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 15%, transparent); }
.pill.mute { color: var(--faint); }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.chart { width: 100%; min-height: 240px; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font: 600 14px/1.2 var(--display); color: var(--muted); padding: 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); }
td input, td select { padding: 3px 5px; font-size: 12.5px; }
td select { min-width: 84px; }
tr.auto td { color: var(--muted); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
tr.total td { font-weight: 600; background: var(--panel-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); text-align: right; }

/* mass bar */
.massbar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.massbar span { display: block; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

/* power tree */
.tree { display: grid; gap: 0; justify-items: center; overflow-x: auto; padding-bottom: 4px; }
.node { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 12px; font-size: 13px; text-align: center; min-width: 180px; }
.node b { font-family: var(--display); display: block; }
.node small { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.node.batt { border-color: var(--accent); }
.vline { width: 2px; height: 18px; background: var(--line-2); }
.branches { display: flex; gap: 12px; justify-content: center; position: relative; padding-top: 18px; flex-wrap: nowrap; }
.branches::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: calc(100% - 180px); height: 2px; background: var(--line-2); }
.branch { display: flex; flex-direction: column; align-items: center; position: relative; }
.branch::before { content: ""; width: 2px; height: 18px; background: var(--line-2); margin-top: -18px; }
.branch ul { list-style: none; padding: 6px 0 0; margin: 0; font-size: 11.5px; color: var(--muted); text-align: center; max-width: 200px; }

.rails { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.rail-v { font: 700 30px/1 var(--display); color: var(--accent); }

/* materials */
.mat { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mat:last-child { border-bottom: 0; }
.mat.out { opacity: 0.5; }
.mat .score { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.mat .score span { display: block; height: 100%; background: var(--accent); }
.mat .name { font: 600 14px var(--display); }
.mat .props { font: 11.5px var(--mono); color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.chip.no { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
@media (max-width: 600px) { .mat { grid-template-columns: 1fr; } }

/* logs */
.tree-msgs { max-height: 640px; overflow: auto; font-size: 12.5px; }
.tree-msgs details { border-bottom: 1px solid var(--line); }
.tree-msgs summary { cursor: pointer; padding: 5px 4px; font-family: var(--mono); display: flex; justify-content: space-between; }
.tree-msgs summary span { color: var(--faint); }
.tree-msgs label { display: flex; gap: 6px; align-items: center; padding: 2px 4px 2px 16px; font-family: var(--mono); cursor: pointer; }
.tree-msgs label:hover { background: var(--panel-2); }
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
canvas.track { width: 100%; height: 300px; display: block; border-radius: 4px; background: var(--panel-2); }
.msglist { max-height: 220px; overflow: auto; font: 12px var(--mono); }

.sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; }
.note { font-size: 12.5px; color: var(--muted); max-width: 70ch; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 50; }

dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line-2); border-radius: 8px; padding: 0; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg-b { padding: 14px 16px; display: grid; gap: 10px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }

/* subsystem colors (--sc set per row) */
.subtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--sc); white-space: nowrap; }
.subtag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--sc); }
table.bom tbody td:first-child { box-shadow: inset 4px 0 0 var(--sc, transparent); padding-left: 10px; }
table.bom .subin { color: var(--sc); font-weight: 600; }
table.bom tr.grp td { background: color-mix(in srgb, var(--sc) 13%, var(--panel)); padding-block: 7px; }
table.bom tbody tr:not(.grp):not(.total):hover td { background: color-mix(in srgb, var(--sc, var(--accent)) 6%, transparent); }
.hint.src { padding: 6px 8px; border-radius: 4px; background: color-mix(in srgb, var(--good) 11%, transparent); color: var(--muted); }
.hint.src.est { background: color-mix(in srgb, var(--warn) 13%, transparent); }

/* export dialog */
.exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.exp { display: grid; gap: 4px; align-content: start; text-align: left; padding: 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel-2); cursor: pointer; }
.exp:hover { border-color: var(--accent); }
.exp b { font-family: var(--display); font-size: 14px; }
.exp span { font-size: 12px; color: var(--muted); }

/* uPlot (inlined stylesheet, themed) */
.uplot, .uplot *, .uplot *::before, .uplot *::after { box-sizing: border-box; }
.uplot { font-family: var(--body); line-height: 1.5; width: min-content; }
.u-wrap { position: relative; user-select: none; }
.u-over, .u-under { position: absolute; }
.u-under { overflow: hidden; }
.uplot canvas { display: block; position: relative; width: 100%; height: 100%; }
.u-axis { position: absolute; }
.u-legend { font-size: 12px; margin: 4px auto 0; text-align: left; font-family: var(--mono); color: var(--muted); }
.u-inline { display: block; } .u-inline * { display: inline-block; }
.u-inline tr { margin-right: 14px; }
.u-legend th { font-weight: 500; }
.u-legend th > * { vertical-align: middle; display: inline-block; }
.u-legend .u-marker { width: 0.8em; height: 0.8em; margin-right: 4px; background-clip: padding-box !important; border-radius: 2px; }
.u-inline.u-live th::after { content: ":"; vertical-align: middle; }
.u-inline:not(.u-live) .u-value { display: none; }
.u-series > * { padding: 2px; }
.u-series th { cursor: pointer; }
.u-legend .u-off > * { opacity: 0.3; }
.u-select { background: var(--accent-soft); position: absolute; pointer-events: none; }
.u-cursor-x, .u-cursor-y { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.u-hz .u-cursor-x, .u-vt .u-cursor-y { height: 100%; border-right: 1px dashed var(--faint); }
.u-hz .u-cursor-y, .u-vt .u-cursor-x { width: 100%; border-bottom: 1px dashed var(--faint); }
.u-cursor-pt { position: absolute; top: 0; left: 0; border-radius: 50%; border: 0 solid; pointer-events: none; will-change: transform; background-clip: padding-box !important; }
.u-axis.u-off, .u-select.u-off, .u-cursor-x.u-off, .u-cursor-y.u-off, .u-cursor-pt.u-off { display: none; }

/* UX additions */
.sep { width: 1px; height: 22px; background: var(--line-2); margin: 0 2px; }
.btn.icon { min-width: 31px; justify-content: center; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; }
.badge { font: 600 10px/1 var(--mono); letter-spacing: 0; padding: 3px 5px; border-radius: 8px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-2); }
.badge.crit { background: var(--crit); color: #fff; border-color: transparent; }
.badge.warn { background: var(--warn); color: #1c1303; border-color: transparent; }
.badge.dot { width: 7px; height: 7px; padding: 0; border-radius: 50%; }
.badge.dot.good { background: var(--good); border-color: transparent; }
.side-tools { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: -4px; }
.toast { display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 14px; }
:root[data-theme="light"] .toast button { color: #ff8a4a; }
input:invalid { border-color: var(--crit); box-shadow: 0 0 0 1px color-mix(in srgb, var(--crit) 35%, transparent); }
.group > summary { transition: color 0.15s; }
.ro[title] { cursor: default; }
.tabs { scroll-behavior: smooth; }

.settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; align-items: start; }
.settings .card h2 { margin-bottom: 2px; }
.btn.danger { color: var(--crit); }

select.subsel { color: var(--sc); font-weight: 600; }
select.subsel option { background: var(--panel); font-weight: 600; }

.stl3d { grid-column: 1 / -1; display: grid; gap: 6px; }
.stl-tools { gap: 6px; }
.stl-host { height: 300px; border-radius: var(--r); overflow: hidden; background: var(--panel-2); cursor: grab; touch-action: none; }
.stl-host canvas { display: block; }

/* quick start */
dialog.qs-dlg { width: min(620px, calc(100vw - 32px)); }
.qs { font-size: 15px; line-height: 1.55; }
.qs p { margin: 0 0 10px; }
.qs-list { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 6px; }
.qs code { font-family: var(--mono); font-size: 13px; background: var(--panel-2); padding: 1px 5px; border-radius: 3px; }
.qs-title { font-size: 19px; }
.qs-dots { display: flex; gap: 6px; justify-content: center; padding-top: 4px; }
.qs-dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: var(--line-2); cursor: pointer; }
.qs-dots button[aria-current="true"] { background: var(--accent); width: 20px; border-radius: 4px; }
.dlg-f .f.check { width: auto; }

.mt-row > td { background: var(--panel-2); padding: 8px 12px 12px 28px; }
.mt-tests table { width: auto; min-width: 60%; }
.mt-tests th { position: static; background: none; }

.libpill { font: 600 9.5px/1 var(--mono, monospace); letter-spacing: .06em; padding: 3px 5px; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); cursor: pointer; flex: none; }
.libpill:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
table.cmp th:first-child { text-align: left; white-space: nowrap; color: var(--muted); font-weight: 500; }
table.cmp td.best { color: var(--good); font-weight: 600; }
table.mis td .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; vertical-align: 0; }
table.mis td.bad { color: var(--crit); font-weight: 600; }
.misbar { position: relative; display: flex; height: 14px; border-radius: 3px; overflow: visible; background: var(--panel-2); margin-bottom: 12px; }
.misbar span { height: 100%; }
.misbar i { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); }
.segrow select { width: auto; }
.cgbar { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); margin: 6px 0 10px; }
.cgbar .win { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 35%, transparent); border-radius: 5px; }
.cgbar b { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; background: var(--accent); border-radius: 2px; }

#setBtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

/* logo: dark artwork on the light theme, light artwork on the dark theme */
.brand .logo { height: 34px; width: auto; display: block; }
.logo-onlight { display: none !important; }
:root[data-theme="light"] .logo-onlight { display: block !important; }
:root[data-theme="light"] .logo-ondark { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.units-seg { margin: auto 4px auto auto; flex: none; }
.tabs .units-seg button { padding: 4px 9px; font: 600 11.5px/1.2 var(--body); border-bottom: 0; color: var(--muted); }
.tabs .units-seg button[aria-pressed="true"] { color: var(--accent); }

/* phone */
@media (max-width: 600px) {
  .bar { gap: 8px; padding: 8px 12px; }
  .brand small, #typePill, .actions .sep { display: none; }
  .brand .logo { height: 26px; }
  .proj { flex: 1 1 140px; }
  .actions { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
  .actions > * { flex: none; }
  .actions .btn { padding-inline: 10px; }
  .tabs { padding: 0 6px; flex-wrap: wrap; overflow: visible; row-gap: 0; } /* all tabs visible: two rows instead of a hidden scroll */
  .tabs button { padding: 8px 7px 7px; font-size: 14px; gap: 4px; }
  .units-seg { margin: 4px 0 6px auto; }
  main { padding: 12px 12px 32px; }
  .bench > .stack { order: -1; }          /* results first, inputs below */
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .ro { padding: 9px 11px; }
  .ro .v { font-size: 22px; }
  .ro .s { font-size: 12px; }
  .card { padding: 12px; }
  .card-h { flex-wrap: wrap; gap: 6px; }
  .branches { flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }
  .branches::before, .branch::before { display: none; }
  .node { min-width: 0; width: min(100%, 300px); }
  .rails { grid-template-columns: minmax(0, 1fr) !important; }
  dialog { width: calc(100vw - 16px) !important; max-width: none !important; }
}

/* flight log viewer */
#lvMap { position: relative; z-index: 0; isolation: isolate; } /* keeps Leaflet's panes under the sticky header */
.lv { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .lv { grid-template-columns: minmax(0, 1fr); } .lv-side { position: static !important; max-height: 70vh !important; order: 2; } .lv-main { order: 1; } }
.lv-side { position: sticky; top: 96px; max-height: calc(100vh - 110px); overflow: auto; scrollbar-width: thin; }
.lv-main { display: grid; gap: 16px; min-width: 0; }
.lv-top { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 16px; }
@media (max-width: 720px) { .lv-top { grid-template-columns: minmax(0, 1fr); } }
.lv-view { position: relative; height: 380px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.lv-view canvas, #lvMap { width: 100%; height: 100%; display: block; }
.lv-view canvas { cursor: grab; touch-action: none; }
.lv-hud canvas { width: 100%; max-width: 200px; aspect-ratio: 1; display: block; margin: 0 auto 10px; }
.lv-hud .kv { font-size: 12px; }
.lv-time { display: flex; gap: 8px; align-items: center; }
.lv-time input[type="range"] { flex: 1; }
.lv-pg h3 { margin: 10px 0 4px; font-size: 11px; }
.lv-chip { cursor: pointer; font: inherit; font-size: 11.5px; }
.lv-chip:hover { border-color: var(--accent); color: var(--fg); }
.lv-params { width: 100%; }
.lv-params td { font-family: var(--mono); font-size: 12px; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.lv-ev { display: grid; grid-template-columns: 50px 10px 1fr; gap: 6px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 5px 2px; cursor: pointer; font: 12px var(--mono); color: var(--fg); }
.lv-ev:not(.mode) { grid-template-columns: 50px 1fr; }
.lv-ev span { color: var(--faint); }
.lv-ev i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.lv-ev.err.bad { color: var(--crit); }
.lv-ev:hover { background: var(--panel-2); }
.leaflet-container { background: var(--panel-2); font-family: var(--body); }

<header class="top">
  <div class="bar">

<script>
// HangarLab engine: physics, power, RF, materials, and log parsing.
// Pure functions only (no DOM) so it can be tested in Node: `node test.js`.
(function (G) {
  'use strict';

  const g0 = 9.80665;
  const RHO0 = 1.225;

  // ---------- constants ----------
  const CELL = {
    lipo: { label: 'LiPo', nom: 3.7, max: 4.2, min: 3.5, whkg: 150 },
    lihv: { label: 'LiHV', nom: 3.8, max: 4.35, min: 3.5, whkg: 160 },
    liion: { label: 'Li-ion', nom: 3.6, max: 4.2, min: 3.0, whkg: 230 },
    life: { label: 'LiFePO4', nom: 3.2, max: 3.65, min: 2.8, whkg: 110 },
  };

  const LAYOUTS = {
    tri: { label: 'Tri (Y3)', n: 3, coax: false },
    quadx: { label: 'Quad X', n: 4, coax: false },
    hexa: { label: 'Hexa', n: 6, coax: false },
    octo: { label: 'Octo', n: 8, coax: false },
    y6: { label: 'Y6 (coaxial)', n: 6, coax: true },
    x8: { label: 'X8 (coaxial)', n: 8, coax: true },
  };

  // ponytail: fixed coaxial factors (lower rotor in upper wash). Replace with per-pair test data if you have it.
  const COAX_THRUST = 0.85;
  const COAX_POWER = 1.22;

  const RAIL_V = { '3.3V': 3.3, '5V': 5, '9V': 9, '12V': 12, '24V': 24 };

  // ---------- helpers ----------
  const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  function interp(xs, ys, x) {
    const n = xs.length;
    if (!n) return NaN;
    if (n === 1) return ys[0];
    let i = 1;
    while (i < n - 1 && xs[i] < x) i++;
    const x0 = xs[i - 1], x1 = xs[i];
    const t = x1 === x0 ? 0 : (x - x0) / (x1 - x0);
    return ys[i - 1] + t * (ys[i] - ys[i - 1]);
  }

  function rhoAt(altM, tempC) {
    const p = 101325 * Math.pow(1 - 2.25577e-5 * altM, 5.25588);
    return p / (287.05 * (tempC + 273.15));
  }

  // b: one pack (s cells in series × p in parallel, cellMah each, g per pack) times `packs`, wired in series or parallel
  function packOf(b) {
    const n = Math.max(1, Math.round(+b.packs || 1)), ser = b.conn === 'series', p = Math.max(1, +b.p || 1);
    const cell = +b.cellMah || +b.mah || 0;
    return { n, ser, S: (+b.s || 1) * (ser ? n : 1), P: p * (ser ? 1 : n), mah: cell * p * (ser ? 1 : n), packMah: cell * p, g: (+b.g || 0) * n };
  }
  function battery(b) {
    const c = CELL[b.chem] || CELL.lipo;
    const pk = packOf(b);
    const V = pk.S * c.nom;
    const Ah = pk.mah / 1000;
    return {
      V, Ah, chem: c, S: pk.S, P: pk.P, mah: pk.mah, g: pk.g, packs: pk.n, packMah: pk.packMah,
      Wh: V * Ah,
      usableWh: V * Ah * (b.usable / 100),
      vMin: pk.S * c.min, vMax: pk.S * c.max,
      iMaxCont: b.c * Ah,
      iMaxPeak: Math.max(+b.c || 0, +b.cPeak || 0) * Ah, // burst rating (seconds); blank peak C = continuous
      peakSet: +b.cPeak > 0,
      estG: (V * Ah) / c.whkg * 1000 / pk.n, // per pack
    };
  }

  // ---------- propulsion curve from bench test table ----------
  // set.rows: [throttle% | null, thrust_g, current_A]; set.v: test voltage.
  function curve(set, vBatt) {
    if (!set) return null;
    let rows = (set.rows || [])
      .filter((r) => r && r[1] > 0 && r[2] >= 0)
      .map((r) => ({ thr: r[0] == null || r[0] === '' ? null : +r[0], g: +r[1], a: +r[2] }))
      .sort((a, b) => a.g - b.g);
    const estimated = rows.length < 2;
    if (estimated) {
      // ponytail: single data point -> thrust ∝ throttle², current ∝ throttle³. Add real bench rows to replace.
      const top = rows[0] || { thr: 100, g: 0, a: 0 };
      rows = [];
      for (let t = 10; t <= 100; t += 10) {
        const x = t / 100;
        rows.push({ thr: t, g: top.g * x * x, a: top.a * x * x * x });
      }
    }
    const vt = set.v || vBatt;
    const vs = vBatt / vt;
    const ks = vs * vs; // static thrust ∝ rpm² ∝ V²
    const top = rows[rows.length - 1];
    const gs = rows.map((r) => r.g);
    const ps = rows.map((r) => r.a * vt);
    const hasThr = rows.every((r) => r.thr != null);
    const thrs = rows.map((r) => r.thr);
    const tmax = top.g * ks;
    return {
      estimated, rows, vt, hasThr,
      tmax, // g at 100% at battery voltage, sea level
      imax: top.a * ks, // A at 100% (P ∝ V³ so I ∝ V²)
      pmax: top.a * vt * ks * vs,
      // electrical W to make thrust g at sea level
      powerAt(g) {
        if (g <= 0) return 0;
        const g0r = gs[0];
        if (g < g0r) return ps[0] * Math.pow(g / g0r, 1.5);
        if (g > gs[gs.length - 1]) {
          const n = gs.length;
          const slope = (ps[n - 1] - ps[n - 2]) / (gs[n - 1] - gs[n - 2] || 1);
          return ps[n - 1] + slope * (g - gs[n - 1]);
        }
        return interp(gs, ps, g);
      },
      throttleAt(g) {
        const gt = g / ks; // thrust needed at the test voltage
        if (!hasThr) return 100 * Math.sqrt(clamp(g / tmax, 0, 4));
        if (gt < gs[0]) return thrs[0] * Math.sqrt(gt / gs[0]);

  // ---------- aerodynamics ----------
  // cd0 may be a number or a function of airspeed (drag build-up: skin friction depends on Reynolds number)
  function fwDrag(V, W, rho, S, AR, cd0, e) {
    const q = 0.5 * rho * V * V;

  // ---------- parasite drag build-up (Raymer, fully turbulent flat-plate friction: conservative for small UAS) ----------

  const cfTurb = (Re) => 0.455 / Math.pow(Math.log10(Math.max(Re, 1e4)), 2.58);

  }
  // skin-friction multiplier by construction. Foam (1.25, with misc 20 % and 80 % motor efficiency) reproduces the
  // AtomRC Dolphin Pro reference (5.25 A @ 22 m/s, 1.4 kg, 6S) uncalibrated; the others are scaled from it.
  const FINISH = { composite: { label: 'Molded composite (glass/carbon)', k: 1.0 }, builtup: { label: 'Built-up, film covered', k: 1.1 }, printed: { label: '3D printed (LW-PLA, PETG)', k: 1.15 }, foam: { label: 'EPO / EPP foam', k: 1.25 } };
  // motor can diameter (mm) from a size code like 2216 (22 mm stator → ~28 mm can), else from weight
  function motorCanMm(m) {
    const mm = String((m && m.name) || '').match(/(?:^|\D)(\d{2})(\d{2})(?:\D|$)/);
    if (mm && +mm[1] >= 10) return +mm[1] + 6;
    return m && m.g ? 7 * Math.cbrt(m.g) : 0;
  }
  // ctx: { pods: {n, d, L} (m), wash: {n, D (prop m), Tper (N), mount: 'wing'|'nose'|'pusher'} }

  // drag build-up methods typically underpredict real small aircraft by 10–30 %; middle of that until you calibrate
  const DEFAULT_K = 1.25;
  const oswald = (AR) => clamp(0.95 / (1.05 + 0.007 * Math.PI * AR), 0.6, 0.88);

  // ponytail: momentum theory + fixed profile/tip-speed assumptions; calibrate with a flight log for accuracy.
  const MR_KAPPA = 1.15, MR_PROFILE_FRAC = 0.35, MR_TIP_SPEED = 120;
  function mrForward(W, rho, Adisk, cda, pHoverMotors, tmaxN, vmaxCap) {

    for (let V = 0; V <= (vmaxCap || 40); V += 0.5) {
      const D = 0.5 * rho * V * V * cda;
      const T = Math.hypot(W, D);
      if (T > 0.85 * tmaxN) break;
      const a = Math.atan2(D, W);
      let vi = vh;
      for (let k = 0; k < 80; k++) {

        vi = 0.5 * vi + 0.5 * vn;
      }
      const pa = MR_KAPPA * T * vi + D * V + pPro * (1 + 3 * Math.pow(V / MR_TIP_SPEED, 2));

  // ---------- motors, props, bench tests ----------
  // lib.motors {id,name,kv,g,maxA,link}, lib.props {id,name,diam,pitch,g,link}, lib.tests {id,motor,prop,v,rows}
  const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const findTest = (lib, mId, pId) => (lib.tests || []).find((t) => t.motor === mId && t.prop === pId && (t.rows || []).length) || null;

  // ---------- prop performance data ----------
  // pr.data = { src, rpm: [..], tab: [[[J, Ct, Cp], ...] per rpm] }
  const sizeOf = (s) => {
    const m = String(s).match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/);
    if (!m) return {};
    // APC file names drop the decimal point: 105x45 = 10.5x4.5
    const fix = (v, other) => (v.length >= 3 && !v.includes('.') && +v > 30 ? +v / 10 : v.length === 2 && +v > 30 && +other < 30 ? +v / 10 : +v);
    return { diam: fix(m[1], m[2]), pitch: fix(m[2], m[1]) };

  // APC PER3_*.dat: blocks "PROP RPM = n" followed by rows V J Pe Ct Cp ...
  function parseAPC(text, fileName) {
    const lines = text.split(/\r?\n/);
    const title = ((lines.find((l) => l.trim()) || '').trim().split(/\s{2,}/)[0] || fileName || 'Prop').replace(/\.dat$/i, '');
    const rpm = [], tab = [];
    let cur = null;
    for (const line of lines) {
      const m = line.match(/PROP RPM\s*=\s*([\d.]+)/i);
      if (m) { cur = []; rpm.push(+m[1]); tab.push(cur); continue; }
      if (!cur) continue;
      const n = line.trim().split(/\s+/).map(Number);
      if (n.length >= 5 && n.slice(0, 5).every(isFinite) && n[3] > 0 && n[4] > 0) cur.push([+n[1].toFixed(4), +n[3].toFixed(4), +n[4].toFixed(4)]);
    }
    const keep = rpm.map((r, i) => [r, tab[i]]).filter(([, t]) => t.length >= 2);
    if (!keep.length) return null;
    const sz = sizeOf(title);
    return { name: 'APC ' + title, diam: sz.diam || 0, pitch: sz.pitch || 0, data: { src: 'APC', rpm: keep.map((x) => x[0]), tab: keep.map((x) => x[1]) } };
  }

  // generic pasted table: columns J, Ct, Cp (+ optional RPM), or static RPM, thrust, power (needs diameter)
  function parsePropTable(text, diamIn) {
    if (/PROP RPM\s*=/i.test(text)) return (parseAPC(text) || {}).data || null;
    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    let hdr = null, start = 0;
    for (let i = 0; i < Math.min(lines.length, 6); i++) if (/[a-z]/i.test(lines[i])) { hdr = lines[i].toLowerCase().split(/[\t,;]+|\s{2,}/).map((s) => s.trim()); start = i + 1; }
    const rows = lines.slice(start).map((l) => l.split(/[\t,;\s]+/).map(Number)).filter((r) => r.length >= 3 && r.every(isFinite));
    if (!rows.length) return null;
    const col = (rx) => (hdr ? hdr.findIndex((h) => rx.test(h)) : -1);
    let iJ = col(/^j\b|adv/), iCt = col(/^ct|thrust coef/), iCp = col(/^cp|power coef/), iR = col(/rpm/);
    if (iJ >= 0 && iCt >= 0 && iCp >= 0) {
      const by = new Map();
      for (const r of rows) { const k = iR >= 0 ? r[iR] : 0; if (!by.has(k)) by.set(k, []); if (r[iCt] > 0 && r[iCp] > 0) by.get(k).push([r[iJ], r[iCt], r[iCp]]); }
      const ks = [...by.keys()].sort((a, b) => a - b);
      return { src: 'Pasted J/Ct/Cp', rpm: ks, tab: ks.map((k) => by.get(k).sort((a, b) => a[0] - b[0])) };
    }
    // static: RPM, thrust, power; units from header (g/kg/N/lbf, W/hp)
    iR = iR >= 0 ? iR : 0;

    const th = hdr ? hdr[iT] || '' : '', ph = hdr ? hdr[iP] || '' : '';

  }

  function propCoef(d, J, rpm) {
    const at = (rows) => {
      if (rows.length === 1 || J <= rows[0][0]) return [rows[0][1], rows[0][2]];
      const last = rows[rows.length - 1];
      if (J >= last[0]) return [Math.max(0, last[1] * (1 - (J - last[0]) * 4)), last[2]];
      return [interp(rows.map((r) => r[0]), rows.map((r) => r[1]), J), interp(rows.map((r) => r[0]), rows.map((r) => r[2]), J)];
    };
    const rs = d.rpm;
    if (rs.length === 1 || rpm <= rs[0]) return at(d.tab[0]);
    if (rpm >= rs[rs.length - 1]) return at(d.tab[rs.length - 1]);
    let i = 1;
    while (rs[i] < rpm) i++;
    const f = (rpm - rs[i - 1]) / (rs[i] - rs[i - 1]), a = at(d.tab[i - 1]), b = at(d.tab[i]);
    return [a[0] + f * (b[0] - a[0]), a[1] + f * (b[1] - a[1])];
  }

  function propModel(pr) {
    const D = (pr.diam || 0) * 0.0254;

  }

  // motor + prop operating point. With Rm the motor equations set rpm; without it rpm = 0.82·kV·V.

  // one motor+prop pair as a "set" that curve() understands

  // electrical W for n motors to make thrust TN at airspeed V (null if out of reach)
  function drivePower(d, n, V, TN, rho) {

    for (let k = 0; k < 24; k++) { const mid = (lo + hi) / 2; if (d.solve(mid, V, rho).T < per) lo = mid; else hi = mid; }

  // old "sets" (motor+prop+rows in one) -> separate motors, props, tests

      let pr = props.find((x) => x.name === s.prop);

  // ---------- mass ----------
  function propulsion(p, lib, V) {

  }

  function massOf(p, lib) {
    const auto = autoRows(p, lib);
    const all = auto.concat(p.bom || []);
    const total = sum(all, (r) => (+r.qty || 0) * (+r.g || 0));
    const bySub = {};
    for (const r of all) bySub[r.sub || 'Other'] = (bySub[r.sub || 'Other'] || 0) + (+r.qty || 0) * (+r.g || 0);
    return { auto, total, bySub };
  }

  // avionics/electronics draw from the flight battery, in W at the battery
  function avionicsPower(p) {
    let w = 0;
    for (const r of p.bom || []) {
      if (!r.rail || r.rail === 'Separate') continue;
      const pw = (+r.qty || 0) * (+r.w || 0);
      w += r.rail === 'VBAT' ? pw : pw / ((p.becEff || 90) / 100);
    }
    return w;
  }

  // ---------- main compute ----------
  function hover(set, n, coax, Wg, sigma, V) {
    if (!set || !n || !set.rows.length) return null;
    const c = curve(set, V);
    const tPer = Wg / n;
    const cf = coax ? COAX_THRUST : 1;
    const pPer = (c.powerAt(tPer) / Math.sqrt(sigma)) * (coax ? COAX_POWER : 1);

    };
  }

  function compute(p, lib, o) {
    o = o || {};
    const b = Object.assign({}, p.batt, o.batt || {});
    const bat = battery(b);
    const pp = Object.assign({}, p, { batt: b });
    if (o.payloadG != null) pp.payload = Object.assign({}, p.payload, { g: o.payloadG });
    const mass = massOf(pp, lib);
    const Wg = mass.total, WN = (Wg / 1000) * g0;
    const rho = rhoAt(p.env.alt, p.env.temp), sigma = rho / RHO0;
    const pAv = avionicsPower(p);
    const R = { type: p.type, bat, mass, Wg, WN, rho, sigma, pAv, checks: [] };
    const chk = (level, msg) => R.checks.push({ level, msg });
    // sustained current (hover/cruise) must stay under the continuous rating; full throttle only lasts seconds, so it is checked against peak
    const battChk = (iMax, iSus, what) => {
      const c = bat.iMaxCont, pk = bat.iMaxPeak;
      if (isFinite(iSus) && iSus > c) chk('crit', `${what[0].toUpperCase() + what.slice(1)} draw ${iSus.toFixed(0)} A exceeds the battery's continuous rating ${c.toFixed(0)} A (${b.c}C). Use a higher-C or larger pack.`);
      if (!isFinite(iMax) || iMax <= c) return;
      if (!bat.peakSet) chk('warn', `Full-throttle draw ${iMax.toFixed(0)} A is above the continuous rating ${c.toFixed(0)} A (${b.c}C). Enter the pack's peak (burst) C to check it against the burst limit.`);
      else if (iMax > pk) chk('crit', `Full-throttle draw ${iMax.toFixed(0)} A exceeds the battery's peak rating ${pk.toFixed(0)} A (${b.cPeak}C burst).`);
      else chk('info', `Full throttle (${iMax.toFixed(0)} A) is above continuous ${c.toFixed(0)} A but within peak ${pk.toFixed(0)} A: fine for short bursts (climb-out, gusts), not sustained.`);
    };

    if (p.type === 'multirotor' || p.type === 'vtol') {
      const L = LAYOUTS[p.mr.layout] || LAYOUTS.quadx;
      const lift = combo(lib, p.mr.motor, p.mr.prop, bat.V);
      const h = hover(lift, p.mr.n, L.coax, Wg, sigma, bat.V);
      R.h = h;
      if (lift && lift.physics) chk(lift.rows.length ? (lift.drive.propData && lift.drive.motorModel ? 'info' : 'warn') : 'crit', lift.rows.length ? `${lift.name}: ${lift.source.toLowerCase()} (no bench data). Add thrust data, prop data or motor Rm/I0 in Library for better numbers.` : `${lift.name}: set the motor kV and prop size, or add bench data.`);
      if (h) {
        const P = h.pMotors + pAv;
        R.hoverP = P;
        R.hoverI = P / bat.V;
        R.hoverMin = (bat.usableWh / P) * 60;
        R.maxI = p.mr.n * h.iMaxMotor + pAv / bat.V;
        const thrustAtLimit = p.mr.n * h.c.thrustAtThrottle(p.mr.maxThr) * sigma * (L.coax ? COAX_THRUST : 1);
        R.payloadG = thrustAtLimit - Wg;
        R.diskLoad = h.diskM2 ? Wg / 1000 / h.diskM2 : null;
        if (h.c.estimated && !lift.physics) chk('warn', `${h.set.name}: only one data point, curve is estimated. Add bench rows in Library.`);
        if (!lift.physics && Math.abs(bat.V - h.c.vt) / h.c.vt > 0.1) chk('warn', `Battery ${bat.V.toFixed(1)} V vs bench test ${h.c.vt.toFixed(1)} V for ${h.set.name}: thrust scaled by (V/Vtest)², verify with a test at your voltage.`);
        if (h.overRange) chk('crit', 'Required thrust per motor is above the 100% bench point. It cannot hover.');
        const twWarn = p.type === 'vtol' ? 1.5 : 2;
        if (h.tw < 1.4) chk('crit', `Thrust-to-weight ${h.tw.toFixed(2)} is too low for control authority (aim ≥ ${twWarn}).`);
        else if (h.tw < twWarn) chk('warn', `Thrust-to-weight ${h.tw.toFixed(2)} is marginal (aim ≥ ${twWarn}).`);
        if (h.thr > 80) chk('crit', `Hover throttle ${h.thr.toFixed(0)}% leaves no margin.`);
        else if (h.thr > 65) chk('warn', `Hover throttle ${h.thr.toFixed(0)}% is high (aim 40–60%).`);
        if (p.mr.escA && h.iMaxMotor > p.mr.escA) chk('crit', `Motor full-throttle current ${h.iMaxMotor.toFixed(1)} A exceeds ESC rating ${p.mr.escA} A.`);
        else if (p.mr.escA && h.iMaxMotor > 0.85 * p.mr.escA) chk('warn', `Motor full-throttle current ${h.iMaxMotor.toFixed(1)} A is within 15% of ESC rating.`);
        if (p.type === 'multirotor') battChk(R.maxI, R.hoverI, 'hover');
        if (p.type === 'multirotor' && !o.lite && h.diskM2) {
          const ff = mrForward(WN, rho, h.diskM2, p.mr.cda, h.pMotors, (h.tmaxTot / 1000) * g0);
          R.ff = ff.map((pt) => {
            const P2 = pt.P + pAv, t = (bat.usableWh / P2) * 3600;
            return { V: pt.V, P: P2, minutes: t / 60, km: (pt.V * t) / 1000, tilt: pt.tilt };
          });
          if (R.ff.length) {
            R.bestRange = R.ff.reduce((a, x) => (x.km > a.km ? x : a));
            R.bestEnd = R.ff.reduce((a, x) => (x.minutes > a.minutes ? x : a));
            R.vmax = R.ff[R.ff.length - 1].V;
          }
        } else if (h.diskM2 === 0) chk('warn', 'Set a prop diameter on the propulsion set to model forward flight.');
      } else if (!lift) chk('crit', 'Pick a lift motor and prop.');
    }

    if (p.type === 'fixedwing' || p.type === 'vtol') {
      const f = p.fw, S = f.area, AR = (f.span * f.span) / S;
      const quadp = p.type === 'vtol' && p.vtol.kind === 'quadplane';
      const dr = f.drag && f.drag.mode === 'buildup' ? f.drag : null;
      const liftSet = quadp ? combo(lib, p.mr.motor, p.mr.prop, bat.V) : null;
      const rotors = quadp && liftSet ? { n: p.mr.n, diamIn: liftSet.diam || 0 } : null;
      const eOsw = dr && dr.eAuto !== false ? oswald(AR) : f.e;
      R.e = eOsw;
      const shared = p.type === 'vtol' && p.vtol.kind !== 'quadplane';
      const cset = shared ? combo(lib, p.mr.motor, p.mr.prop, bat.V) : combo(lib, f.motor, f.prop, bat.V);
      const cn = shared ? p.mr.n : f.n;
      const mObj = (lib.motors || []).find((m) => m.id === (shared ? p.mr.motor : f.motor));
      const mount = dr && dr.mount && dr.mount !== 'auto' ? dr.mount : cn >= 2 ? 'wing' : 'nose';
      const can = motorCanMm(mObj) / 1000, podCfg = (dr && dr.pods) || {};
      const pods = !dr || podCfg.mode === 'none' ? null : podCfg.mode === 'manual' ? { n: +podCfg.n || 0, d: +podCfg.d || 0, L: +podCfg.L || 0 } : mount === 'wing' && can ? { n: cn, d: 1.3 * can, L: 3.9 * can } : null;
      const Dprop = cset ? (cset.diam || 0) * 0.0254 : 0;
      // two passes: drag without wash -> thrust per motor -> slipstream speed -> wash drag
      const bu = (V, W) => {
        const a = dragBuildup(f, dr, V, rho, p.env.temp, rotors, { pods });
        if (!Dprop || !cn) return a;
        const q = 0.5 * rho * V * V, CL = W / (q * S), Dn = q * S * (a.cd0 + (CL * CL) / (Math.PI * eOsw * AR));
        return dragBuildup(f, dr, V, rho, p.env.temp, rotors, { pods, wash: { n: cn, D: Dprop, Tper: Dn / cn, mount } });
      };
      const cd0 = dr ? (V, W) => bu(V, W || WN).cd0 : f.cd0 + (quadp ? p.vtol.dcd0 : 0);
      R.drag = dr ? bu(f.vc, WN) : null;
      R.mount = dr ? mount : null;
      R.cd0 = typeof cd0 === 'function' ? cd0(f.vc, WN) : cd0;
      R.chord = S / f.span;
      const propK = f.propOther ? 0.85 : 1; // prop differs from its data (e.g. glass-fiber vs APC): −15 % thrust per watt
      const eta = (f.etaP / 100) * (f.etaD / 100) * propK;
      const c = cset && cset.rows.length ? curve(cset, bat.V) : null;
      if (!shared && cset && cset.physics) chk(cset.drive && cset.drive.propData ? 'info' : 'warn', `${cset.name}: ${cset.source.toLowerCase()} (no bench data).`);
      R.AR = AR;
      R.wingLoad = Wg / 1000 / S; // kg/m²
      R.vs = Math.sqrt((2 * WN) / (rho * S * f.clmax));
      // with real prop data, cruise power comes from the motor+prop solve at airspeed; otherwise assumed efficiencies
      const dm0 = cset && cset.drive && cset.drive.propData ? cset.drive : null;
      const dm = dm0 && propK < 1 ? Object.assign({}, dm0, { solve: (t, V, r) => { const s = dm0.solve(t, V, r); return Object.assign({}, s, { T: s.T * propK, etaP: s.etaP * propK }); } }) : dm0;
      R.propModel = !!dm;
      const dragN = (V, W, k) => fwDrag(V, W, rho, S, AR, cd0, eOsw).D * k;
      const propP = (V, W, k) => {
        if (dm) { const r = drivePower(dm, cn, V, dragN(V, W, k), rho); return r && r.P; }
        return (fwDrag(V, W, rho, S, AR, cd0, eOsw).P * k) / eta;
      };
      // drag correction: learned from your calibrated flights, else the default theory-to-flight gap
      const cfg = lib.cfg || {}, useLearned = lib.fleetK > 0 && cfg.learn !== false;
      let k = useLearned ? lib.fleetK : cfg.defK > 0 ? cfg.defK : DEFAULT_K;
      R.kSource = useLearned ? 'learned' : 'default';
      if (f.cal && f.cal.on && f.cal.v > 0 && f.cal.a > 0 && f.cal.g > 0) {
        const target = f.cal.a * bat.V, Wm = (f.cal.g / 1000) * g0;
        if (dm) {
          let lo = 0.2, hi = 5;
          for (let j = 0; j < 30; j++) { const mid = (lo + hi) / 2, P = propP(f.cal.v, Wm, mid); if (P == null || P > target) hi = mid; else lo = mid; }
          k = (lo + hi) / 2;
        } else k = target / propP(f.cal.v, Wm, 1);
        R.calK = k;
        R.kSource = 'calibrated';
      }
      R.kUsed = k;
      const pReq = (V) => { const P = propP(V, WN, k); return P == null ? null : P + pAv; };
      const tst = c ? (cn * c.tmax * sigma * g0) / 1000 : 0;
      const vp = cset && cset.kv && cset.pitch ? (cset.kv * bat.V * 0.85 * cset.pitch * 0.0254) / 60 : null;
      const tav = (V) => (dm ? cn * dm.solve(1, V, rho).T : vp ? Math.max(0, tst * (1 - V / vp)) : tst);
      R.staticTW = tst / WN;
      R.pitchSpeed = vp;
      if (!o.lite) {
        const v0 = R.vs * 1.05, v1 = dm ? R.vs * 4.5 : Math.max(v0 + 5, Math.min(vp || R.vs * 4, R.vs * 4.5));
        const pts = [];
        for (let i = 0; i <= 90; i++) {
          const V = v0 + ((v1 - v0) * i) / 90;
          const P = pReq(V);
          if (P == null) continue;
          const d = fwDrag(V, WN, rho, S, AR, cd0, eOsw), t = (bat.usableWh / P) * 3600;
          pts.push({ V, P, minutes: t / 60, km: (V * t) / 1000, roc: ((tav(V) - d.D * k) * V) / WN, D: d.D * k, CL: d.CL });
        }
        R.fwCurve = pts;
        const safe = pts.filter((x) => x.V >= 1.2 * R.vs);
        const pool = safe.length ? safe : pts;
        R.bestEnd = pool.reduce((a, x) => (x.P < a.P ? x : a), pool[0]);
        R.bestRange = pool.reduce((a, x) => (x.km > a.km ? x : a), pool[0]);
        R.vmaxLevel = dm || vp ? (pts.filter((x) => x.roc >= 0).pop() || {}).V : null;
        R.maxRoc = pts.length ? Math.max(...pts.map((x) => x.roc)) : null;
      }
      const vc = f.vc, pc = pReq(vc);
      R.cruise = { V: vc, P: pc == null ? NaN : pc, I: pc == null ? NaN : pc / bat.V, CL: fwDrag(vc, WN, rho, S, AR, cd0, eOsw).CL };
      R.cruise.minutes = (bat.usableWh / R.cruise.P) * 60;
      R.cruise.km = (vc * R.cruise.minutes * 60) / 1000;
      // conservative case: +20 % propulsion power (one-reference tuning; typical conceptual-design spread)
      if (!R.calK) {
        const pc2 = (R.cruise.P - pAv) * ((lib.cfg && lib.cfg.cons > 0) ? lib.cfg.cons : CONSERVATIVE) + pAv;
        Object.assign(R.cruise, { consP: pc2, consMinutes: (bat.usableWh / pc2) * 60, consKm: ((vc * bat.usableWh) / pc2) * 3.6 });
      }
      if (dm) {
        const dp = drivePower(dm, cn, vc, dragN(vc, WN, k), rho);
        if (dp) Object.assign(R.cruise, { etaP: dp.etaP, etaM: dp.etaM, thr: dp.thr, rpm: dp.rpm });
      }
      R.cruiseSet = cset;
      if (!c) chk('crit', 'Pick a cruise motor and prop (with kV and prop size, or bench data).');
      else if (c.estimated && !cset.physics) chk('warn', `${cset.name}: only one data point, thrust curve is estimated.`);
      if (pc == null) chk('crit', `The cruise motor and prop cannot hold ${vc} m/s at this weight.`);
      if (R.fwCurve && R.fwCurve.length) R.LDmax = Math.max(...R.fwCurve.map((x) => R.WN / x.D));
      R.LDcruise = R.WN / fwDrag(vc, WN, rho, S, AR, cd0, eOsw).D;
      if (R.LDcruise > 14 && !(R.calK)) chk('warn', `Cruise L/D ${R.LDcruise.toFixed(1)} is glider territory. Check wing area and the drag inputs (fuselage, add-ons).`);
      if (AR < 4 || AR > 14) chk('warn', `Aspect ratio ${AR.toFixed(1)} (mean chord ${(R.chord * 1000).toFixed(0)} mm) looks off. Check span and wing area.`);
      if (vc < 1.3 * R.vs) chk('warn', `Cruise ${vc} m/s is under 1.3 × stall (${(1.3 * R.vs).toFixed(1)} m/s).`);
      if (R.cruise.CL > 0.9 * f.clmax) chk('crit', `Cruise CL ${R.cruise.CL.toFixed(2)} is near CLmax.`);
      if (p.type === 'fixedwing' && R.staticTW < 0.4) chk('warn', `Static thrust-to-weight ${R.staticTW.toFixed(2)} is low for hand launch (aim ≥ 0.5).`);
      if (!dm && vp && vc > vp * 0.85) chk('warn', `Cruise is close to pitch speed ${vp.toFixed(1)} m/s; consider more pitch.`);
      if (dm && R.cruise.thr > 85) chk('warn', `Cruise needs ${R.cruise.thr.toFixed(0)}% throttle; little speed margin.`);
      if (!dm && c && R.cruise.P - pAv > cn * c.pmax * 0.9) chk('crit', 'Cruise power exceeds what the cruise motor can deliver.');
      if (p.type === 'fixedwing') {
        R.maxI = (c ? cn * c.imax : 0) + pAv / bat.V;
        battChk(R.maxI, R.cruise.I, 'cruise');
        // payload limited by stall speed target
        if (f.vsMax) R.payloadG = ((f.vsMax * f.vsMax * rho * S * f.clmax) / 2 / g0) * 1000 - Wg;
      }
    }

    if (p.type === 'vtol' && R.h && R.cruise) {
      const v = p.vtol;
      const eAvail = bat.usableWh * (1 - v.reserve / 100);
      const eHover = (R.hoverP * v.hoverS) / 3600;
      const eCruise = eAvail - eHover;
      const consCruiseP = R.cruise.consP || R.cruise.P;
      R.mission = {
        eAvail, eHover, eCruise,
        consKm: Math.max(0, ((eAvail - eHover) / consCruiseP) * 3600 * p.fw.vc / 1000),
        consMinutes: Math.max(0, ((eAvail - eHover) / consCruiseP) * 60),
        minutes: Math.max(0, (eCruise / R.cruise.P) * 60),
        km: Math.max(0, (eCruise / R.cruise.P) * 3600 * p.fw.vc / 1000),
      };
      if (eCruise <= 0) chk('crit', 'Hover segments use all available energy; nothing left for cruise.');
      R.maxI = R.h.iMaxMotor * p.mr.n + pAv / bat.V;
      battChk(R.maxI, Math.max(R.hoverI || 0, R.cruise.I || 0), 'hover');
    }

    if (Wg > 25000) chk('warn', 'AUW over 25 kg: FAA Part 107 limit (55 lb) is near or exceeded.');
    if (bat.Wh > 100) chk('info', `Pack is ${bat.Wh.toFixed(0)} Wh (>100 Wh): airline carry-on limits apply.`);
    if (!R.checks.some((c) => c.level !== 'info')) chk('good', 'No issues found with the current inputs.');
    return R;
  }

  // battery capacity sweep: weight scales with capacity at the current pack's g/mAh
  function batterySweep(p, lib) {
    const cell = +p.batt.cellMah || +p.batt.mah, g = +p.batt.g;
    const out = [];
    for (let f = 0.25; f <= 3.001; f += 0.0625) {
      const r = compute(p, lib, { batt: { cellMah: cell * f, mah: cell * f, g: g * f }, lite: true });
      out.push({ mah: r.bat.mah, g: r.bat.g, minutes: enduranceOf(p, r), auw: r.Wg });
    }
    return out;
  }

  const enduranceOf = (p, r) => (p.type === 'multirotor' ? r.hoverMin : p.type === 'fixedwing' ? r.cruise && r.cruise.minutes : r.mission && r.mission.minutes);

  // payload mass sweep: endurance and (for lift craft) hover throttle vs payload
  function payloadSweep(p, lib) {
    const cur = (p.payload && +p.payload.g) || 0;
    const top = Math.max(1000, cur * 2.5);
    const out = [];
    for (let k = 0; k <= 40; k++) {
      const g = (top * k) / 40;
      const r = compute(p, lib, { payloadG: g, lite: true });
      out.push({ g, minutes: enduranceOf(p, r), thr: r.h ? r.h.thr : null, km: p.type === 'fixedwing' ? r.cruise && r.cruise.km : r.mission ? r.mission.km : null });
    }
    return out;
  }

  // every component of a design: auto rows (motors, props, pack, payload) + BOM
  function fullBom(p, lib) {
    return autoRows(p, lib).map((r) => Object.assign({ rail: '', w: 0, rf: '' }, r)).concat(p.bom || []);
  }

  // purchase list across designs: rows merged by name + subsystem, qty per design
  function consolidate(projects, lib) {
    const map = new Map();
    projects.forEach((p, i) => {
      for (const r of fullBom(p, lib)) {
        const k = `${r.sub}|${r.name}`;
        const e = map.get(k) || { name: r.name, sub: r.sub, g: +r.g || 0, w: +r.w || 0, link: r.link || '', buy: r.buy || '', cost: +r.cost || 0, qty: projects.map(() => 0) };
        e.qty[i] += +r.qty || 0;
        map.set(k, e);
      }
    });
    return [...map.values()];
  }

  const costOf = (p, lib) => sum(fullBom(p, lib), (r) => (+r.qty || 0) * (+r.cost || 0));

  // longitudinal CG from item positions (mm from the design's datum); items without a position are listed, not guessed
  function cgOf(p, lib) {
    const pos = (p.cg && p.cg.pos) || {};
    let gm = 0, g = 0, missing = 0;
    for (const r of fullBom(p, lib)) {
      const m = (+r.qty || 0) * (+r.g || 0), x = r.auto ? pos[r.key] : r.x;
      if (!m) continue;
      if (x === '' || x == null || !isFinite(+x)) { missing++; continue; }
      gm += m * +x; g += m;
    }
    const x = g ? gm / g : null, out = { x, g, missing };
    if (p.type !== 'multirotor' && p.fw && x != null) {
      const mac = +p.cg.mac > 0 ? +p.cg.mac : (p.fw.area / p.fw.span) * 1000;
      out.mac = mac;
      out.pct = ((x - (+p.cg.le || 0)) / mac) * 100;
    }
    return out;
  }

  // mission profile: energy per segment from the computed power curves (R must be a full compute, not lite)
  // ponytail: climb adds W·rate/0.7 (mr) or /0.6 (fw) on top of hover / best-endurance power; descent costs 85 % hover (mr) or avionics only (fw). Good to ~10 %; a flight log beats it.
  const SEG = { hover: ['Hover', 's'], climb: ['Climb', 'm'], cruise: ['Cruise', 'km'], loiter: ['Loiter', 'min'], descend: ['Descend', 'm'] };
  function missionPlan(p, lib, R) {
    const M = p.mission;
    if (!M || !(M.segs || []).length) return null;
    const fw = p.type !== 'multirotor', w = +M.wind || 0, W = R.WN, pAv = R.pAv;
    const consK = R.calK || !fw ? 1 : (lib.cfg && lib.cfg.cons > 0 ? lib.cfg.cons : CONSERVATIVE);
    const curve = fw ? R.fwCurve : R.ff;
    const pAt = (V) => {
      if (fw && Math.abs(V - p.fw.vc) < 1e-6 && R.cruise && isFinite(R.cruise.P)) return R.cruise.P;
      if (!curve || !curve.length) return null;
      if (V <= curve[0].V) return curve[0].P;
      for (let i = 1; i < curve.length; i++) if (curve[i].V >= V) { const a = curve[i - 1], b = curve[i], t = (V - a.V) / (b.V - a.V); return a.P + t * (b.P - a.P); }
      return null; // faster than this aircraft can fly
    };
    const V = fw ? p.fw.vc : +M.vMr > 0 ? +M.vMr : R.bestRange && R.bestRange.V;
    const rate = +M.climb > 0 ? +M.climb : 2;
    const rows = [];
    for (const sg of M.segs) {
      const v = +sg.v || 0, r = { type: sg.type, label: SEG[sg.type] ? SEG[sg.type][0] : sg.type, v, unit: SEG[sg.type] ? SEG[sg.type][1] : '', t: 0, P: null, err: '' };
      if (sg.type === 'hover') { r.t = v; r.P = R.hoverP; if (!R.hoverP) r.err = 'No lift motors: this aircraft cannot hover.'; }
      else if (sg.type === 'climb') {
        r.t = v / rate;
        r.P = !fw ? R.hoverP + (W * rate) / 0.7 : R.bestEnd ? R.bestEnd.P + (W * rate) / 0.6 : null;
        if (fw && R.maxRoc != null && rate > R.maxRoc) r.err = `Climb rate ${rate} m/s is above the best climb ${R.maxRoc.toFixed(1)} m/s.`;
      } else if (sg.type === 'descend') { r.t = v / (fw ? 2 : 1.5); r.P = fw ? pAv : R.hoverP * 0.85; }
      else if (sg.type === 'loiter') { r.t = v * 60; r.P = fw ? R.bestEnd && R.bestEnd.P : R.hoverP; }
      else if (sg.type === 'cruise') {
        const dir = sg.dir || 'none';
        const gs = dir === 'head' ? V - w : dir === 'tail' ? V + w : dir === 'cross' ? Math.sqrt(Math.max(0, V * V - w * w)) : V;
        r.V = V; r.gs = gs; r.dir = dir;
        r.P = V ? pAt(V) : null;
        if (!(gs > 0.5)) r.err = `Wind ${w} m/s is as fast as the ${V ? V.toFixed(1) : '?'} m/s airspeed: no progress.`;

  const MODES = {
    copter: { 0: 'Stabilize', 1: 'Acro', 2: 'AltHold', 3: 'Auto', 4: 'Guided', 5: 'Loiter', 6: 'RTL', 7: 'Circle', 9: 'Land', 11: 'Drift', 13: 'Sport', 14: 'Flip', 15: 'AutoTune', 16: 'PosHold', 17: 'Brake', 18: 'Throw', 19: 'Avoid_ADSB', 20: 'Guided_NoGPS', 21: 'Smart_RTL', 22: 'FlowHold', 23: 'Follow', 24: 'ZigZag', 25: 'SystemID', 26: 'Heli_Autorotate', 27: 'Auto RTL' },

  function logVehicle(log) {
    const m = log.msgs.MSG;
    if (!m) return 'copter';

  }

  function logModes(log) {
    const m = log.msgs.MODE;

  }

  // per flight mode: average speed, current and power while cruising (armed, moving, roughly level)

  function modeCruise(log, segs) {

    const bt = bat.time(), bv = bat.col(bat.cols.includes('Volt') ? 'Volt' : 'V'), bi = bat.col(bat.cols.includes('Curr') ? 'Curr' : 'I');

  function logSummary(log) {

  function gpsTrack(log) {
    const g = findMsg(log, 'GPS') || findMsg(log, 'POS');

    const latC = g.cols.includes('Lat') ? 'Lat' : null, lngC = g.cols.includes('Lng') ? 'Lng' : g.cols.includes('Lon') ? 'Lon' : null;

  }

  // ---------- log viewer helpers ----------
  // ArduPilot ERR subsystems and EV ids (common ones; others show their number)
  const ERR_SUBSYS = { 1: 'Main', 2: 'Radio', 3: 'Compass', 4: 'Optical flow', 5: 'Radio failsafe', 6: 'Battery failsafe', 7: 'GPS failsafe', 8: 'GCS failsafe', 9: 'Fence failsafe', 10: 'Flight mode', 11: 'GPS', 12: 'Crash check', 13: 'Flip', 14: 'Autotune', 15: 'Parachute', 16: 'EKF check', 17: 'EKF failsafe', 18: 'Barometer', 19: 'CPU', 20: 'ADSB failsafe', 21: 'Terrain', 22: 'Navigation', 23: 'Terrain failsafe', 24: 'EKF primary', 25: 'Thrust loss', 26: 'Sensor failsafe', 27: 'Leak failsafe', 28: 'Pilot input', 29: 'Vibration failsafe' };

  // nearest earlier sample (sample-and-hold), binary search
  function idxAt(t, x) {

    if (!t.length || x < t[0]) return -1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (t[m] <= x) lo = m; else hi = m - 1; }
    return lo;
  }

  function logEvents(log) {
    const out = [];
    for (const m of logModes(log)) out.push({ t: m.t, kind: 'mode', text: `Mode → ${m.name}` });
    const add = (name, fn) => { const m = log.msgs[name]; if (!m) return; const t = m.time(); for (let k = 0; k < t.length; k++) { const e = fn(m, k); if (e) out.push(Object.assign({ t: t[k] }, e)); } };
    add('MSG', (m, k) => ({ kind: 'msg', text: String(m.col('Message')[k]) }));
    add('ERR', (m, k) => { const s = m.col('Subsys')[k], c = m.col('ECode')[k]; return { kind: 'err', text: `${ERR_SUBSYS[s] || `Subsystem ${s}`}: ${c ? `error code ${c}` : 'cleared'}`, ok: !c }; });

  }

  // last value of every parameter (PARM Name/Value), with how many times it changed during the log
  function logParams(log) {
    const m = log.msgs.PARM;
    if (!m) return [];
    const nm = m.col('Name'), v = m.col('Value'), t = m.time(), map = new Map();
    for (let k = 0; k < nm.length; k++) {
      const e = map.get(nm[k]);
      if (!e) map.set(nm[k], { name: nm[k], value: v[k], t: t[k], changes: 0 });
      else { if (e.value !== v[k]) e.changes++; e.value = v[k]; e.t = t[k]; }

  // flight path in local metres (east, north, up) from the first fix
  function logTrack(log) {
    const g = findMsg(log, 'POS') && findMsg(log, 'POS').cols.includes('Lat') ? findMsg(log, 'POS') : findMsg(log, 'GPS');
    if (!g || !g.cols.includes('Lat')) return null;
    const lngC = g.cols.includes('Lng') ? 'Lng' : g.cols.includes('Lon') ? 'Lon' : null;
    if (!lngC) return null;
    const la = g.col('Lat'), lo = g.col(lngC), al = g.cols.includes('Alt') ? g.col('Alt') : null, tt = g.time();
    const sc = Math.abs(la[Math.floor(la.length / 2)]) > 1000 ? 1e-7 : 1;

    for (let k = 0; k < la.length; k++) {

  // synthetic quad flight so the viewer is not empty before a real log is dropped in

<script>
// HangarLab UI. State lives in S; inputs bind with data-k (design path) or data-lib (library path).
(function () {
  'use strict';
  const U = window.UAS;
  const KEY = 'uas-workbench.v1'; // storage key kept from the old name so saved work still loads
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const fin = (v) => v != null && isFinite(v);
  const fmt = (v, d = 1) => (fin(v) ? Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—');
  const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const PRN = () => (S.lib.printer || { lineW: 0.45, layerH: 0.2 });
  const SUBS = ['Structures', '3D printed', 'Propulsion', 'Power', 'Avionics', 'Sensors', 'Comms', 'Compute', 'Payload', 'Wiring', 'Hardware', 'Other'];
  const RAILS = [['', '—'], ['VBAT', 'VBAT'], ['3.3V', '3.3 V'], ['5V', '5 V'], ['9V', '9 V'], ['12V', '12 V'], ['24V', '24 V'], ['Separate', 'Own supply']];
  const RF_OPTS = [['', '—']].concat(Object.entries(U.BANDS).filter(([k]) => k !== 'gnss').map(([k, b]) => [k, b.label]));
  const TYPE_LABEL = { multirotor: 'Multirotor', fixedwing: 'Fixed-wing', vtol: 'Hybrid VTOL' };

  // subsystems: S.lib.subs = [{key, name, color}]. Designs store the key, so renaming never touches data.
  // CORE_SUBS are used by the calculations (motors, pack, payload, airframe, printed parts): rename and recolor only.
  const SUB_HUE = { Structures: 212, '3D printed': 84, Propulsion: 24, Power: 352, Avionics: 268, Sensors: 172, Comms: 196, Compute: 316, Payload: 140, Wiring: 50, Hardware: 32, Other: 220 };
  const CORE_SUBS = ['Structures', '3D printed', 'Propulsion', 'Power', 'Payload', 'Other'];
  const hueHex = (h, sat, l) => { const f = (n) => { const k = (n + h / 30) % 12, a = sat * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); }; return `#${f(0)}${f(8)}${f(4)}`; };
  const defaultSubColor = (key) => { let h = SUB_HUE[key]; if (h == null) { h = 0; for (const ch of String(key)) h = (h * 31 + ch.charCodeAt(0)) % 360; } return hueHex(h, key === 'Other' ? 0.09 : key === 'Hardware' ? 0.26 : 0.66, 0.54); };
  const subsOf = () => (S && S.lib && S.lib.subs) || SUBS.map((k) => ({ key: k, name: k, color: defaultSubColor(k) }));
  const subFind = (sub) => { const l = subsOf(), t = String(sub ?? '').toLowerCase(); return l.find((x) => x.key === sub) || l.find((x) => x.name.toLowerCase() === t); };
  const subName = (sub) => (subFind(sub) || {}).name || sub || 'Other';
  const subKeys = () => subsOf().map((x) => x.key);
  const subOrder = (sub) => { const i = subKeys().indexOf((subFind(sub) || {}).key); return i < 0 ? 99 : i; };
  function subColor(sub) { const x = subFind(sub); return x ? x.color : defaultSubColor(sub); }
  // name or key from a spreadsheet / paste → key; unknown names become new subsystems
  function subKeyOf(v) {
    const t = String(v || '').trim();
    if (!t) return 'Other';
    const x = subFind(t);
    if (x) return x.key;
    S.lib.subs.push({ key: t, name: t, color: defaultSubColor(t) });
    return t;
  }
  const subTag = (sub) => `<span class="subtag" style="--sc:${subColor(sub)}">${esc(subName(sub))}</span>`;

  // ---------- state ----------
  let S;
  const MISSION_DEF = {
    multirotor: [['climb', 60], ['cruise', 2, 'head'], ['loiter', 10], ['cruise', 2, 'tail'], ['descend', 60]],
    fixedwing: [['climb', 120], ['cruise', 10, 'head'], ['loiter', 15], ['cruise', 10, 'tail'], ['descend', 120]],
    vtol: [['hover', 30], ['climb', 100], ['cruise', 8, 'head'], ['loiter', 10], ['cruise', 8, 'tail'], ['descend', 100], ['hover', 30]],
  };
  function fixDesign(p) {
    if (!p.mission) p.mission = { wind: 0, reserve: 0, climb: 2, vMr: 0, segs: (MISSION_DEF[p.type] || MISSION_DEF.fixedwing).map(([type, v, dir]) => ({ type, v, dir: dir || 'none' })) };
    if (!p.cg) p.cg = { le: 0, mac: 0, pos: {} };
    if (!p.resFix) { if (p.mission.reserve === 20) p.mission.reserve = 0; if (p.vtol && p.vtol.reserve === 20) p.vtol.reserve = 0; p.resFix = 1; }
    return p;
  }
  function fresh() {
    const seed = clone(window.UAS_SEED);
    seed.projects.forEach(fixDesign);
    seed.lib.subs = SUBS.map((k) => ({ key: k, name: k, color: defaultSubColor(k) }));
    seed.lib.knownDefaults = LIB_KINDS.flatMap((k) => (seed.lib[k] || []).map((x) => `${k}:${x.id}`));
    return { v: 5, settings: migrate({ v: 5, projects: [], lib: {} }).settings, theme: 'dark', tab: 'design', libTab: 'motors', massView: 'edit', bomSel: [], active: seed.projects[0].id, projects: seed.projects, lib: seed.lib };
  }
  // v1 stored motor+prop+bench rows together as "sets"; v2 splits them and adds a payload field
  function migrate(s) {
    if (s.v === 1) {
      const { motors, props, tests, map } = U.splitSets(s.lib.sets);
      Object.assign(s.lib, { motors, props, tests });
      delete s.lib.sets;
      for (const p of s.projects) {
        for (const o of [p.mr, p.fw]) { if (o && o.set && map[o.set]) [o.motor, o.prop] = map[o.set]; if (o) delete o.set; }
        const pay = (p.bom || []).filter((r) => r.sub === 'Payload' && /payload/i.test(r.name));
        p.payload = { name: pay.length ? pay.map((r) => r.name).join(' + ') : 'Payload', g: pay.reduce((a, r) => a + r.qty * r.g, 0) };
        p.bom = (p.bom || []).filter((r) => !pay.includes(r));
      }
      if (s.libTab === 'sets') s.libTab = 'motors';
      s.v = 2;
    }
    for (const pr of (s.lib && s.lib.props) || []) { const a = (window.UAS_APC || {})[pr.name]; if (a && !pr.data) pr.data = a.data; }
    if (s.v === 2) {
      // batteries become single packs with cells in parallel and a pack count
      const fix = (b) => { if (b.cellMah == null) { b.p = b.p || 1; b.cellMah = (+b.mah || 0) / b.p; } return b; };
      for (const p of s.projects) Object.assign(fix(p.batt), { packs: p.batt.packs || 1, conn: p.batt.conn || 'parallel' });
      (s.lib.batteries || []).forEach(fix);
      s.lib.printed = s.lib.printed || [];
      const seed = window.UAS_SEED.lib;
      for (const k of ['batteries', 'printed']) for (const x of seed[k]) if (!s.lib[k].some((y) => y.id === x.id)) s.lib[k].push(clone(x));
      s.lib.printer = s.lib.printer || clone(seed.printer);
      s.v = 3;
    }
    if (s.v === 3) {
      // printed parts: "wall share %" becomes wall count + top/bottom layers + surface area
      const fix = (x) => { if (x && x.walls == null) { x.walls = 3; x.tb = 4; x.area = x.area || 0; delete x.shell; } };
      s.lib.printer = s.lib.printer || { lineW: 0.45, layerH: 0.2 };
      for (const x of s.lib.printed || []) {
        fix(x);
        const m = U.MATERIALS.find((q) => q.id === x.mat);
        if (m) x.g = +U.partMass(x, m.rho, s.lib.printer).toFixed(1);
      }
      s.projects.forEach((p) => fix(p.mat));
      s.v = 4;
    }
    if (s.v === 4) {
      for (const p of s.projects) {
        if (p.fw.drag) continue;
        const b = +p.fw.span || 1, extras = [];
        if ((p.bom || []).some((r) => /gimbal|siyi|a8 mini|camera ball/i.test(r.name))) extras.push({ name: 'Gimbal camera', cda: 40, qty: 1 });
        const ant = (p.bom || []).filter((r) => r.rf && r.rf !== 'gnss').length;
        if (ant) extras.push({ name: 'Exposed antenna', cda: 5, qty: ant });
        const quadp = p.type === 'vtol' && p.vtol && p.vtol.kind === 'quadplane';
        p.fw.drag = { mode: 'buildup', fusL: +(0.7 * b).toFixed(2), fusD: +(0.09 * b).toFixed(3), tailPct: 22, tc: 0.12, booms: quadp ? { n: 2, L: +(0.55 * b).toFixed(2), d: 0.025 } : { n: 0, L: 0, d: 0 }, extras, misc: 15, eAuto: true };
      }
